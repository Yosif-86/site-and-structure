# iPhone builds on Codemagic (no Mac needed). Builds the Flutter app in
# mobile_app/, signs it for the App Store and uploads it to TestFlight.
#
# One-time setup in Codemagic (after the Apple Developer account exists):
#   1. Teams > Integrations > App Store Connect: add an API key and name it
#      "Arc Platform ASC" (App Store Connect > Users and Access > Integrations
#      > App Store Connect API, role App Manager).
#   2. APP_STORE_APP_ID (numeric Apple ID of the app) is set in ios-release vars.
#   3. Bundle ID com.arcplatformiq.app with Push Notifications
#      enabled must exist in the Apple Developer portal.

workflows:
  # Unsigned build for a personal test install before the paid Apple account:
  # download the IPA artifact and install it with Sideloadly (free Apple ID,
  # works 7 days, no push notifications or Sign in with Apple).
  ios-test-unsigned:
    name: iOS test build (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: mobile_app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events: []  # manual builds only
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build unsigned app
        script: flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          cd build/ios/iphoneos
          rm -rf Payload && mkdir Payload
          cp -R Runner.app Payload/
          zip -qr "$CM_BUILD_DIR/arc-unsigned.ipa" Payload
    artifacts:
      - $CM_BUILD_DIR/arc-unsigned.ipa

  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile_app
    integrations:
      app_store_connect: Arc Platform ASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.arcplatformiq.app
      vars:
        APP_STORE_APP_ID: "6822579758"  # App Store Connect > App Information > Apple ID
        # STORE BUILDS MUST BE "false" (protection on). "true" = test build: screenshot shield, recording cover and capture
        # reports are OFF so issues can be shown with screenshots/recordings.
        # Set to "false" for the build that goes to the App Store.
        NO_SCREEN_PROTECTION: "true"
    triggering:
      events: []  # manual builds only
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Tests
        script: flutter test
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
          flutter build ipa --release \
            --build-number=$((LATEST + 1)) \
            --dart-define=NO_SCREEN_PROTECTION=$NO_SCREEN_PROTECTION \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
