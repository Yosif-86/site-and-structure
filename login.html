<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول | Arc Platform</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14120F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .login-wrap{min-height:calc(100vh - 140px); display:flex; align-items:center; justify-content:center; padding:40px 16px;}
  .login{width:100%; max-width:400px;}
  .login h1{font-size:28px; margin-bottom:6px;}
  .login .lead{font-size:15px; margin-top:0; margin-bottom:28px;}
  .field{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .field label{font-size:14px; font-weight:600;}
  .field input{direction:ltr; text-align:left; font-family:inherit; font-size:15px; padding:13px 14px; border-radius:12px;
    border:1px solid var(--line); background:var(--panel); color:var(--text);}
  .field input:focus{outline:none; border-color:var(--red);}
  .login .btn{width:100%; justify-content:center; border:none; cursor:pointer; margin-top:6px;}
  .login .btn[disabled]{opacity:.6; cursor:default;}
  .msg{font-size:14px; margin:4px 0 10px; min-height:1.4em;}
  .msg.err{color:var(--red);}
  .msg.ok{color:var(--teal);}
  .links{display:flex; justify-content:space-between; gap:12px; margin-top:18px; font-size:14px;}
  .links button{background:none; border:none; color:var(--muted); font:inherit; cursor:pointer; padding:0;}
  .links button:hover{color:var(--text);}
  dialog#codeDlg{margin:auto; inset:0; height:fit-content; border:0; padding:0; background:transparent; width:min(420px, 92vw); max-width:none; color:var(--text);}
  dialog#codeDlg::backdrop{background:rgba(0,0,0,.62); backdrop-filter:blur(4px);}
  .codebox{background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:26px 22px; box-shadow:0 30px 80px rgba(0,0,0,.5);}
</style>
</head>
<body>

<header>
  <div class="wrap head">
    <a class="brand" href="/">
      <svg class="brand-mark arc-mark" viewBox="211 249 400 400" aria-hidden="true" style="background:none;border-radius:0"><defs><clipPath id="arcClip"><rect x="200" y="240" width="420" height="388"></rect></clipPath></defs><path fill="none" stroke="#E8622C" stroke-width="44" stroke-linejoin="round" clip-path="url(#arcClip)" d="M347 456 L399 320 Q418 270 438 320 L540 575 C552 605 530 618 505 598 L420 532 C400 514 330 496 306 566 L280 645"></path></svg>
      <span class="brand-name">ARC PLATFORM<small>منصة آرك</small></span>
    </a>
  </div>
</header>

<main class="login-wrap">
  <form class="login" id="loginForm" novalidate>
    <h1>تسجيل دخول</h1>
    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="username" required>
    </div>
    <div class="field" id="passwordField">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <p class="msg" id="msg" role="alert"></p>
    <button class="btn btn-accent" id="submitBtn" type="submit">تسجيل الدخول</button>
    <div id="oauthBlock">
      <div class="or"><span>أو</span></div>
      <div class="oauth-btn" id="googleFace" role="button" tabindex="0">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span>المتابعة باستخدام جوجل</span>
        <div id="gisBtn" class="gis"></div>
      </div>
      <button class="oauth-btn apple" id="appleBtn" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.4.8c1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.7-1-2.7-4.1zM13.9 5c.7-.9 1.2-2 1-3.2-1 .1-2.2.7-3 1.6-.6.7-1.2 1.9-1 3.1 1.1.1 2.3-.6 3-1.5z"/></svg><span>المتابعة باستخدام Apple</span>
      </button>
    </div>
    <div class="links">
      <button type="button" id="forgotBtn">نسيت كلمة المرور؟</button>
      <a href="/">العودة للرئيسية</a>
    </div>
  </form>
</main>

<dialog id="codeDlg">
  <form class="login codebox" id="codeForm" novalidate>
    <h1 style="font-size:24px">رمز التحقق</h1>
    <p class="lead" id="codeLead" style="margin-bottom:18px"></p>
    <div class="field">
      <label for="code">الرمز المكوّن من 6 أرقام</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
    </div>
    <p class="msg" id="codeMsg" role="alert"></p>
    <button class="btn btn-accent" id="codeBtn" type="submit">تأكيد الرمز</button>
    <div class="links">
      <button type="button" id="resendBtn">إعادة إرسال الرمز</button>
      <button type="button" id="codeCancel">إلغاء</button>
    </div>
  </form>
</dialog>

<script src="staff-login.js"></script>
</body>
</html>
