# Stamps the Arc logo on a course file a teacher uploaded, keeping its format:
#   PDF   -> logo in the middle of every page, still a PDF
#   Photo -> logo in the middle, same image format
# (Word/Excel/PowerPoint/CAD are published as-is by api/course-file.js.)
# Started by api/course-file.js right after the upload. Each student's own
# name and phone are drawn over the file by the app while they view it.
#
# Needs the CONVERT_KEY repository secret (already used by the lecture
# conversion). This repository is public: the file links are fetched from
# api/course-file.js with that key and masked, never passed as inputs.
name: Process course file

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: course_files id (uuid)
        required: true

concurrency:
  group: course-file-${{ inputs.file_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API: https://site-and-structure.vercel.app/api/course-file
      FILE_ID: ${{ inputs.file_id }}
      CONVERT_KEY: ${{ secrets.CONVERT_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check input
        run: |
          [[ "$FILE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "bad file id"; exit 1; }
          [ -n "$CONVERT_KEY" ] || { echo "CONVERT_KEY secret missing"; exit 1; }

      - name: Get the job
        id: job
        run: |
          CODE=$(curl -sS -X POST "$API" -H "Content-Type: application/json" \
            -H "x-convert-key: $CONVERT_KEY" \
            -d "{\"action\":\"job\",\"fileId\":\"$FILE_ID\"}" -o job.json -w '%{http_code}')
          # Deleted while waiting in the queue: nothing to do, not a failure.
          if [ "$CODE" = "404" ]; then
            echo "::notice::File was deleted before processing started; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$CODE" = "200" ] || { echo "job request failed: HTTP $CODE"; exit 1; }
          SRC=$(jq -r .srcUrl job.json); DST=$(jq -r .uploadUrl job.json)
          echo "::add-mask::$SRC"; echo "::add-mask::$DST"
          {
            echo "SRC_URL=$SRC"
            echo "DST_URL=$DST"
            echo "KIND=$(jq -r .kind job.json)"
            echo "EXT=$(jq -r .ext job.json)"
          } >> "$GITHUB_ENV"
          rm job.json

      - name: Install tools
        if: steps.job.outputs.skip != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          mkdir -p /tmp/stamp && cd /tmp/stamp && npm init -y >/dev/null && npm i pdf-lib@1.17.1 >/dev/null

      - name: Download the original
        if: steps.job.outputs.skip != 'true'
        run: |
          curl -fsSL --retry 5 --retry-delay 5 "$SRC_URL" -o "input.$EXT"
          ls -lh "input.$EXT"

      - name: Make the watermark logo
        if: steps.job.outputs.skip != 'true'
        run: |
          # Grey version of the logo (keeps transparency) so it shows on white pages.
          convert mobile_app/assets/icon/foreground.png -fill '#5c5c5c' -colorize 100 wm.png

      - name: Convert and stamp
        if: steps.job.outputs.skip != 'true'
        run: |
          case "$KIND" in
            pdf)
              NODE_PATH=/tmp/stamp/node_modules node scripts/stamp-pdf.js "input.$EXT" wm.png out.pdf
              echo "OUT=out.pdf" >> "$GITHUB_ENV"; echo "TYPE=application/pdf" >> "$GITHUB_ENV" ;;
            image)
              # Same format out as in (a PNG stays a PNG).
              convert "input.$EXT" -auto-orient "base.$EXT"
              W=$(identify -format '%w' "base.$EXT"); H=$(identify -format '%h' "base.$EXT")
              S=$(( (W < H ? W : H) * 45 / 100 ))
              convert wm.png -resize "${S}x${S}" wm-s.png
              composite -dissolve 14 -gravity center wm-s.png "base.$EXT" -quality 92 "out.$EXT"
              case "$EXT" in png) T=image/png ;; *) T=image/jpeg ;; esac
              echo "OUT=out.$EXT" >> "$GITHUB_ENV"; echo "TYPE=$T" >> "$GITHUB_ENV" ;;
            *) echo "unknown kind"; exit 1 ;;
          esac

      - name: Upload the processed copy
        if: steps.job.outputs.skip != 'true'
        run: |
          curl -fsS --retry 5 --retry-delay 3 -X PUT \
            -H "Content-Type: $TYPE" -H "x-upsert: true" \
            --data-binary @"$OUT" "$DST_URL" > /dev/null
          ls -lh "$OUT"

      - name: Mark ready
        if: steps.job.outputs.skip != 'true'
        run: |
          curl -fsS -X POST "$API" -H "Content-Type: application/json" \
            -H "x-convert-key: $CONVERT_KEY" \
            -d "{\"action\":\"finish\",\"fileId\":\"$FILE_ID\",\"ok\":true}"

      - name: Mark failed
        if: failure()
        run: |
          curl -fsS -X POST "$API" -H "Content-Type: application/json" \
            -H "x-convert-key: $CONVERT_KEY" \
            -d "{\"action\":\"finish\",\"fileId\":\"$FILE_ID\",\"ok\":false}" || true
