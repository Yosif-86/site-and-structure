<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Site & Structure</title>
<script>(function(){try{var t=localStorage.getItem('ss_theme')||'dark'; document.documentElement.setAttribute('data-theme', t);}catch(e){}})();</script>
<script>(function(){try{var l=localStorage.getItem('ss_lang')||'en'; document.documentElement.setAttribute('lang', l); document.documentElement.setAttribute('dir', l==='ar'?'rtl':'ltr');}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#14120F;
    --panel:#1D1A16;
    --panel2:#26221C;
    --grid:#14120F;
    --line:rgba(243,237,228,0.12);
    --red:#E8622C;
    --yellow:#6FA8A0;
    --green:#6FA8A0;
    --text:#F3EDE4;
    --muted:#AFA492;
    --muted2:#7D7362;
    --glass-bg:rgba(38,34,28,0.5);
    --glass-border:rgba(243,237,228,0.16);
    --glare:rgba(255,255,255,0.14);
  }
  :root[data-theme="light"]{
    --bg:#F3EFE7;
    --panel:#FFFFFF;
    --panel2:#EAE3D6;
    --grid:#F3EFE7;
    --line:rgba(30,25,18,0.14);
    --red:#C94E1F;
    --yellow:#3E7D74;
    --green:#3E7D74;
    --text:#1E1912;
    --muted:#5C5344;
    --muted2:#8C8171;
    --glass-bg:rgba(255,255,255,0.55);
    --glass-border:rgba(255,255,255,0.7);
    --glare:rgba(255,255,255,0.8);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{overflow-x:hidden; max-width:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    line-height:1.6;
    transition:background .2s ease, color .2s ease;
  }
  .wrap{max-width:1200px; margin:0 auto; padding:0 24px;}

  header{border-bottom:1px solid var(--line); padding:20px 0; position:sticky; top:0; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); z-index:50;}
  header .wrap{display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;}
  .brand-mark{width:34px; height:34px; border-radius:8px; background:linear-gradient(145deg, var(--red), color-mix(in srgb, var(--red) 55%, black)); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-size:11px; color:#fff;}
  .brand-mark span{}
  .brand-name{font-family:'Big Shoulders Display'; font-weight:800; font-size:19px; letter-spacing:0.2px; text-transform:uppercase;}
  .brand-name small{display:block; font-family:'IBM Plex Mono'; font-size:10px; color:var(--muted2); font-weight:400; letter-spacing:1px; text-transform:none;}
  nav{display:flex; gap:28px; align-items:center; flex-wrap:wrap;}
  nav a{color:var(--muted); text-decoration:none; font-size:14px;}
  nav a:hover{color:var(--text);}
  .theme-toggle{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; padding:0; line-height:1;
  }
  .theme-toggle:hover{background:var(--panel2);}
  .lang-toggle{
    height:38px; padding:0 12px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:'IBM Plex Mono'; letter-spacing:0.5px;
  }
  .lang-toggle:hover{background:var(--panel2);}
  :root[dir="rtl"] body{font-family:'Cairo', 'Work Sans', sans-serif;}
  :root[dir="rtl"] h2, :root[dir="rtl"] .brand-name{font-family:'Cairo', sans-serif; text-transform:none;}
  :root[dir="rtl"] th, :root[dir="rtl"] .status{font-family:'Cairo', sans-serif; text-transform:none;}
  :root[dir="rtl"] th, :root[dir="rtl"] td{text-align:right;}

  @media (max-width:700px){
    header .wrap{flex-wrap:wrap; row-gap:12px;}
    nav{gap:12px 16px; width:100%;}
    .brand-name{font-size:15px;}
    .brand-name small{font-size:8px;}
  }
  .btn{
    font-family:'Work Sans'; font-size:13px; font-weight:600;
    padding:10px 20px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover{background:var(--panel2);}
  .btn-accent{background:var(--red); border-color:var(--red); color:#fff;}
  .btn-accent:hover{transform:translateY(-1px); box-shadow:0 10px 24px -8px rgba(201,78,31,0.5); background:var(--red);}

  .section{padding:48px 0;}
  .section-head{margin-bottom:24px;}
  h2{font-family:'Big Shoulders Display'; font-weight:800; font-size:24px; text-transform:uppercase;}
  .section-tag{font-family:'IBM Plex Mono'; font-size:11px; color:var(--muted2); letter-spacing:1px; text-transform:uppercase;}

  table{width:100%; border-collapse:collapse;}
  th, td{text-align:left; padding:10px 12px; font-size:13px; border-bottom:1px solid var(--line);}
  th{font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--muted2); text-transform:uppercase; letter-spacing:0.5px;}
  tr:last-child td{border-bottom:none;}
  .status{font-family:'IBM Plex Mono'; font-size:10.5px; padding:3px 8px; border-radius:999px; border:1px solid var(--line); letter-spacing:0.5px; text-transform:uppercase; white-space:nowrap;}
  .status.active{color:var(--green); border-color:var(--green);}
  .status.pending{color:var(--yellow); border-color:var(--yellow);}
  .flagged-yes{color:var(--red); font-weight:600;}
  .empty{color:var(--muted); font-size:14px; padding:16px;}
  .table-wrap{
    --mx:50%; --my:50%;
    overflow-x:auto; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:16px;
    position:relative; isolation:isolate;
    box-shadow:0 16px 40px -24px rgba(30,25,18,0.25);
    backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    transition:transform .4s cubic-bezier(0.16,1,0.3,1), box-shadow .4s cubic-bezier(0.16,1,0.3,1);
  }
  .table-wrap:hover{transform:translateY(-4px); box-shadow:0 26px 50px -20px rgba(30,25,18,0.3), 0 0 40px -8px color-mix(in srgb, var(--red) 45%, transparent);}

  /* glass glare — follows the cursor via --mx/--my set in JS */
  .table-wrap::before{
    content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(260px circle at var(--mx) var(--my), var(--glare), transparent 70%);
    opacity:0; transition:opacity .8s ease; mix-blend-mode:soft-light;
  }
  .table-wrap:hover::before{ opacity:1; }
  @media (prefers-reduced-motion: reduce){
    .table-wrap::before{ animation:none !important; opacity:0 !important; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="brand">
      <div class="brand-mark"><span>&#9651;</span></div>
      <div class="brand-name">SITE &amp; STRUCTURE<small data-i18n="tagline">ADMIN DASHBOARD</small></div>
    </a>
    <nav>
      <a href="index.html" data-i18n="nav_home">Home</a>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      <button class="lang-toggle" id="langToggle" onclick="toggleLang()" aria-label="Toggle language" title="Toggle language"></button>
      <button class="btn" id="logoutBtn" data-i18n="log_out">Log out</button>
    </nav>
  </div>
</header>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div class="section-tag" data-i18n="enrollments">Enrollments</div>
      <h2 data-i18n="students_courses">Students &amp; courses</h2>
    </div>
    <div class="table-wrap">
      <table id="enrollTable">
        <thead>
          <tr>
            <th data-i18n="th_email">Email</th><th data-i18n="th_name">Name</th><th data-i18n="th_phone">Phone</th>
            <th data-i18n="th_course">Course</th><th data-i18n="th_status">Status</th><th data-i18n="th_payment">Payment</th>
            <th data-i18n="th_enrolled">Enrolled</th><th></th>
          </tr>
        </thead>
        <tbody id="enrollBody"></tbody>
      </table>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div class="section-tag" data-i18n="account_sharing_watch">Account sharing watch</div>
      <h2 data-i18n="flagged_logins">Flagged logins</h2>
    </div>
    <div class="table-wrap">
      <table id="flagTable">
        <thead>
          <tr><th data-i18n="th_email">Email</th><th data-i18n="th_city">City</th><th data-i18n="th_country">Country</th><th data-i18n="th_distance">Distance</th><th data-i18n="th_when">When</th></tr>
        </thead>
        <tbody id="flagBody"></tbody>
      </table>
    </div>
  </div>
</section>

<script>
  const I18N = {
    en: {
      tagline: 'ADMIN DASHBOARD', nav_home: 'Home', log_out: 'Log out',
      enrollments: 'Enrollments', students_courses: 'Students & courses',
      th_email: 'Email', th_name: 'Name', th_phone: 'Phone', th_course: 'Course', th_status: 'Status',
      th_payment: 'Payment', th_enrolled: 'Enrolled', th_city: 'City', th_country: 'Country', th_distance: 'Distance', th_when: 'When',
      account_sharing_watch: 'Account sharing watch', flagged_logins: 'Flagged logins',
      status_active: 'Active', status_pending: 'Pending',
      view_proof: 'View proof', approve: 'Approve', remove: 'Remove',
      no_enrollments: 'No enrollments yet.', no_flagged: 'No flagged logins.',
      confirm_remove: 'Remove {email} from "{title}"? This revokes their access.',
      alert_approve_failed: 'Failed to approve: ', alert_remove_failed: 'Failed to remove: ', alert_proof_failed: 'Failed to load proof: '
    },
    ar: {
      tagline: 'لوحة تحكم الإدارة', nav_home: 'الرئيسية', log_out: 'تسجيل الخروج',
      enrollments: 'التسجيلات', students_courses: 'الطلاب والدورات',
      th_email: 'البريد الإلكتروني', th_name: 'الاسم', th_phone: 'الهاتف', th_course: 'الدورة', th_status: 'الحالة',
      th_payment: 'الدفع', th_enrolled: 'تاريخ التسجيل', th_city: 'المدينة', th_country: 'الدولة', th_distance: 'المسافة', th_when: 'الوقت',
      account_sharing_watch: 'مراقبة مشاركة الحساب', flagged_logins: 'تسجيلات دخول مشبوهة',
      status_active: 'مفعّل', status_pending: 'قيد الانتظار',
      view_proof: 'عرض الإثبات', approve: 'موافقة', remove: 'إزالة',
      no_enrollments: 'لا توجد تسجيلات بعد.', no_flagged: 'لا توجد تسجيلات دخول مشبوهة.',
      confirm_remove: 'إزالة {email} من "{title}"؟ سيؤدي هذا لإلغاء وصوله.',
      alert_approve_failed: 'فشلت الموافقة: ', alert_remove_failed: 'فشلت الإزالة: ', alert_proof_failed: 'فشل تحميل الإثبات: '
    }
  };
  let currentLang = document.documentElement.getAttribute('lang') || 'en';
  function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || (I18N.en[key] || key); }

  function applyLang(lang){
    currentLang = lang;
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    try{ localStorage.setItem('ss_lang', lang); }catch(e){}
    const btn = document.getElementById('langToggle');
    if(btn) btn.textContent = lang === 'ar' ? 'EN' : 'AR';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
    if(typeof loadEnrollments === 'function') loadEnrollments();
    if(typeof loadFlagged === 'function') loadFlagged();
  }
  function toggleLang(){ applyLang(currentLang === 'ar' ? 'en' : 'ar'); }

  const SUPABASE_URL = 'https://qdarzhzttjpkgfihupgp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_eNLSJi_xpL2fnrJsHKajeQ_sT9Kds9q';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let courseTitles = {};

  document.addEventListener('mousemove', (e) => {
    const el = e.target.closest('.table-wrap');
    if(!el) return;
    const rect = el.getBoundingClientRect();
    el.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width * 100) + '%');
    el.style.setProperty('--my', ((e.clientY - rect.top) / rect.height * 100) + '%');
  });

  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('ss_theme', t); }catch(e){}
    const btn = document.getElementById('themeToggle');
    if(btn) btn.textContent = t === 'dark' ? '☀' : '☾';
  }
  function toggleTheme(){
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }
  applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
  applyLang(currentLang);

  document.getElementById('logoutBtn').onclick = async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  };

  async function approve(enrollmentId){
    const { error } = await sb.from('enrollments').update({ status: 'active' }).eq('id', enrollmentId);
    if(error){ alert(t('alert_approve_failed') + error.message); return; }
    loadEnrollments();
  }
  window.approve = approve;

  async function removeEnrollment(enrollmentId, title, email){
    if(!confirm(t('confirm_remove').replace('{email}', email).replace('{title}', title))) return;
    const { error } = await sb.from('enrollments').delete().eq('id', enrollmentId);
    if(error){ alert(t('alert_remove_failed') + error.message); return; }
    loadEnrollments();
  }
  window.removeEnrollment = removeEnrollment;

  async function viewProof(path){
    const { data, error } = await sb.storage.from('payment-proofs').createSignedUrl(path, 60);
    if(error){ alert(t('alert_proof_failed') + error.message); return; }
    window.open(data.signedUrl, '_blank');
  }
  window.viewProof = viewProof;

  async function loadEnrollments(){
    const { data: profiles } = await sb.from('profiles').select('id, full_name, phone');
    const { data: enrollments } = await sb.from('enrollments')
      .select('id, user_id, course_slug, status, payment_method, payment_detail, payment_proof_path, created_at')
      .order('created_at', { ascending: false });
    const { data: logins } = await sb.from('login_events')
      .select('user_id, email, created_at')
      .order('created_at', { ascending: false });

    const emailByUser = {};
    (logins || []).forEach(l => { if(!emailByUser[l.user_id]) emailByUser[l.user_id] = l.email; });
    const profileByUser = {};
    (profiles || []).forEach(p => { profileByUser[p.id] = p; });

    const body = document.getElementById('enrollBody');
    if(!enrollments || enrollments.length === 0){
      body.innerHTML = `<tr><td colspan="8" class="empty">${t('no_enrollments')}</td></tr>`;
      return;
    }

    const isAr = currentLang === 'ar';
    body.innerHTML = enrollments.map(e => {
      const prof = profileByUser[e.user_id] || {};
      const email = emailByUser[e.user_id] || '—';
      const c = courseTitles[e.course_slug];
      const title = (c && ((isAr && c.title_ar) || c.title)) || e.course_slug;
      const isActive = e.status === 'active';
      const date = new Date(e.created_at).toLocaleDateString();
      const payment = e.payment_method ? (e.payment_method + (e.payment_detail ? ' — ' + e.payment_detail : '')) : '—';
      return `
        <tr>
          <td>${email}</td>
          <td>${prof.full_name || '—'}</td>
          <td>${prof.phone || '—'}</td>
          <td>${title}</td>
          <td><span class="status ${isActive ? 'active' : 'pending'}">${isActive ? t('status_active') : t('status_pending')}</span></td>
          <td>${payment}</td>
          <td>${date}</td>
          <td style="display:flex; gap:8px;">
            ${e.payment_proof_path ? `<button class="btn" onclick="viewProof('${e.payment_proof_path}')">${t('view_proof')}</button>` : ''}
            ${isActive ? '' : `<button class="btn btn-accent" onclick="approve('${e.id}')">${t('approve')}</button>`}
            <button class="btn" onclick="removeEnrollment('${e.id}', '${title.replace(/'/g,"\\'")}', '${email.replace(/'/g,"\\'")}')">${t('remove')}</button>
          </td>
        </tr>`;
    }).join('');
  }

  async function loadFlagged(){
    const { data: flagged } = await sb.from('login_events')
      .select('email, city, country, distance_km, created_at')
      .eq('flagged', true)
      .order('created_at', { ascending: false })
      .limit(50);

    const body = document.getElementById('flagBody');
    if(!flagged || flagged.length === 0){
      body.innerHTML = `<tr><td colspan="5" class="empty">${t('no_flagged')}</td></tr>`;
      return;
    }
    body.innerHTML = flagged.map(f => `
      <tr>
        <td>${f.email || '—'}</td>
        <td>${f.city || '—'}</td>
        <td>${f.country || '—'}</td>
        <td class="flagged-yes">${f.distance_km} km</td>
        <td>${new Date(f.created_at).toLocaleString()}</td>
      </tr>`).join('');
  }

  (async () => {
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ window.location.href = 'index.html'; return; }
    const { data: prof } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
    if(!prof || !prof.is_admin){ window.location.href = 'index.html'; return; }

    const { data: allCourses } = await sb.from('courses').select('slug, title, title_ar');
    (allCourses || []).forEach(c => { courseTitles[c.slug] = c; });

    loadEnrollments();
    loadFlagged();
  })();
</script>

</body>
</html>
