<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course — Site & Structure</title>
<script>(function(){try{var t=localStorage.getItem('ss_theme')||'dark'; document.documentElement.setAttribute('data-theme', t);}catch(e){}})();</script>
<script>(function(){try{var l=localStorage.getItem('ss_lang')||'en'; document.documentElement.setAttribute('lang', l); document.documentElement.setAttribute('dir', l==='ar'?'rtl':'ltr');}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#14120F; --panel:#1D1A16; --panel2:#26221C; --line:rgba(243,237,228,0.12); --red:#E8622C; --yellow:#6FA8A0;
    --green:#6FA8A0; --text:#F3EDE4; --muted:#AFA492; --muted2:#7D7362;
    --glass-bg:rgba(38,34,28,0.5); --glass-border:rgba(243,237,228,0.16); --glare:rgba(255,255,255,0.14);
  }
  :root[data-theme="light"]{
    --bg:#F3EFE7; --panel:#FFFFFF; --panel2:#EAE3D6; --line:rgba(30,25,18,0.14); --red:#C94E1F; --yellow:#3E7D74;
    --green:#3E7D74; --text:#1E1912; --muted:#5C5344; --muted2:#8C8171;
    --glass-bg:rgba(255,255,255,0.55); --glass-border:rgba(255,255,255,0.7); --glare:rgba(255,255,255,0.8);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{overflow-x:hidden; max-width:100%;}
  body{
    background:var(--bg);
    color:var(--text); font-family:'Work Sans', sans-serif; line-height:1.6;
    transition:background .2s ease, color .2s ease;
  }
  .wrap{max-width:1040px; margin:0 auto; padding:0 24px;}
  .crop{position:relative;}

  header{border-bottom:1px solid var(--line); padding:20px 0; position:sticky; top:0; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); z-index:50;}
  header .wrap{display:flex; align-items:center; justify-content:space-between; flex-wrap:nowrap; gap:10px;}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; min-width:0;}
  .brand-mark{width:34px; height:34px; border-radius:8px; background:linear-gradient(145deg, var(--red), color-mix(in srgb, var(--red) 55%, black)); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-size:11px; color:#fff; flex-shrink:0;}
  .brand-mark span{}
  .brand-name{font-family:'Big Shoulders Display'; font-weight:800; font-size:19px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand-name small{display:block; font-family:'IBM Plex Mono'; font-size:10px; color:var(--muted2); font-weight:400; letter-spacing:1px; text-transform:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  nav{display:flex; gap:10px; align-items:center; flex-wrap:nowrap; flex-shrink:0;}
  nav a{color:var(--muted); text-decoration:none; font-size:14px;}
  nav a:hover{color:var(--text);}
  .theme-toggle{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; padding:0; line-height:1; flex-shrink:0;
  }
  .theme-toggle:hover{background:var(--panel2);}
  .lang-toggle{
    height:38px; padding:0 12px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:'IBM Plex Mono'; letter-spacing:0.5px; flex-shrink:0;
  }
  .lang-toggle:hover{background:var(--panel2);}
  :root[dir="rtl"] body{font-family:'Cairo', 'Work Sans', sans-serif;}
  :root[dir="rtl"] h1, :root[dir="rtl"] h2, :root[dir="rtl"] .brand-name{font-family:'Cairo', sans-serif; text-transform:none;}
  :root[dir="rtl"] .tag, :root[dir="rtl"] .status-badge{font-family:'Cairo', sans-serif; text-transform:none;}

  .nav-links-desktop{display:none;}
  .hamburger-btn{
    display:flex; width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text);
    cursor:pointer; align-items:center; justify-content:center; font-size:18px; padding:0; flex-shrink:0;
  }
  .hamburger-btn:hover{background:var(--panel2);}
  .drawer-backdrop{display:none; position:fixed; inset:0; background:rgba(10,8,6,0.6); z-index:199;}
  .drawer-backdrop.open{display:block;}
  .drawer{
    position:fixed; top:0; bottom:0; width:min(300px,82vw); z-index:200;
    background:var(--panel); padding:20px; display:flex; flex-direction:column; gap:6px;
    transition:transform .3s cubic-bezier(0.16,1,0.3,1); overflow-y:auto;
  }
  :root:not([dir="rtl"]) .drawer{left:0; transform:translateX(-100%); border-right:1px solid var(--line);}
  :root:not([dir="rtl"]) .drawer.open{transform:translateX(0);}
  :root[dir="rtl"] .drawer{right:0; transform:translateX(100%); border-left:1px solid var(--line);}
  :root[dir="rtl"] .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  .drawer-title{font-family:'Big Shoulders Display'; font-weight:800; font-size:18px; text-transform:uppercase;}
  :root[dir="rtl"] .drawer-title{font-family:'Cairo', sans-serif; text-transform:none;}
  .drawer-close{background:none; border:none; color:var(--red); font-size:20px; cursor:pointer; line-height:1;}
  .drawer-links{display:flex; flex-direction:column; gap:4px;}
  .drawer-links a{color:var(--text); text-decoration:none; font-size:15px; padding:12px 8px; border-radius:8px;}
  .drawer-links a:hover{background:var(--panel2);}
  .drawer-links .btn{margin-top:12px;}

  @media (max-width:480px){
    .brand-name{font-size:15px;} .brand-name small{font-size:8px;}
    .lang-toggle{padding:0 8px;}
  }

  .btn{font-family:'Work Sans'; font-size:13px; font-weight:600; padding:10px 20px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, background .15s ease;}
  .btn:hover{background:var(--panel2);}
  .btn-accent{background:var(--red); border-color:var(--red); color:#fff;}
  .btn-accent:hover{transform:translateY(-1px); box-shadow:0 10px 24px -8px rgba(201,78,31,0.5); background:var(--red);}

  .course-head{padding:56px 0 32px;}
  .tag{font-family:'IBM Plex Mono'; font-size:11px; color:var(--red); letter-spacing:1px; text-transform:uppercase;}
  .tag.green{color:var(--green);}
  h1{font-family:'Big Shoulders Display'; font-weight:800; font-size:36px; margin:10px 0 14px; text-transform:uppercase;}
  .byline{font-family:'IBM Plex Mono'; font-size:12px; color:#A8496B; margin-bottom:14px;}
  .desc{color:var(--muted); font-size:15px; max-width:640px;}

  .meta-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin:24px 0; font-family:'IBM Plex Mono'; font-size:11px;}
  .meta-grid div span{display:block; color:var(--muted2); font-size:9.5px; text-transform:uppercase; margin-bottom:3px;}
  .meta-grid div b{font-weight:500;}
  @media (max-width:600px){ .meta-grid{grid-template-columns:1fr 1fr;} }

  .price-box{display:flex; align-items:center; gap:16px; margin-top:20px; flex-wrap:wrap;}
  .price{font-family:'Big Shoulders Display'; font-size:26px; font-weight:800;}
  .price.free{color:var(--yellow);}
  .status-badge{font-family:'IBM Plex Mono'; font-size:10.5px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); text-transform:uppercase;}
  .status-badge.active{color:var(--green); border-color:var(--green);}
  .status-badge.pending{color:var(--yellow); border-color:var(--yellow);}

  .section{padding:32px 0; border-top:1px solid var(--line);}
  h2{font-family:'Big Shoulders Display'; font-weight:800; font-size:22px; margin-bottom:20px; text-transform:uppercase;}
  .lecture{--mx:50%; --my:50%; display:flex; align-items:center; justify-content:space-between; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:12px; padding:14px 18px; margin-bottom:10px; position:relative; overflow:hidden; isolation:isolate; backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%); transition:transform .4s cubic-bezier(0.16,1,0.3,1), box-shadow .4s cubic-bezier(0.16,1,0.3,1);}
  .lecture:hover{transform:translateY(-4px); box-shadow:0 20px 40px -18px rgba(0,0,0,0.3), 0 0 36px -8px color-mix(in srgb, var(--red) 50%, transparent);}
  .lecture-title{font-size:14px;}
  .lecture-free{font-family:'IBM Plex Mono'; font-size:10px; color:var(--yellow); margin-left:10px;}
  .lecture-lock{color:var(--muted2); font-size:13px;}

  .overlay{display:none; position:fixed; inset:0; background:rgba(30,25,18,0.55); z-index:100; align-items:center; justify-content:center; padding:20px;}
  .overlay.active{display:flex;}
  .modal{--mx:50%; --my:50%; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:20px; width:100%; max-width:420px; padding:28px; position:relative; overflow:hidden; isolation:isolate; backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);}
  .modal-close{position:absolute; top:14px; right:14px; background:none; border:none; color:var(--red); font-size:18px; cursor:pointer; font-family:'IBM Plex Mono';}
  .btn-close{color:var(--red); border-color:var(--red); background:transparent;}
  .btn-close:hover{background:color-mix(in srgb, var(--red) 12%, transparent);}
  .modal h3{font-family:'Big Shoulders Display'; font-weight:800; font-size:22px; margin-bottom:6px; text-transform:uppercase;}
  .modal .sub{color:var(--muted); font-size:13px; margin-bottom:22px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--muted2); text-transform:uppercase; margin-bottom:6px;}
  .field input{width:100%; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:10px 12px; font-size:14px; font-family:'Work Sans';}
  .field input:focus{outline:none; border-color:var(--red);}
  .pay-options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;}
  .pay-opt{border:1px solid var(--line); border-radius:10px; padding:14px 10px; text-align:center; cursor:pointer; font-size:13px; font-weight:500;}
  .pay-opt.selected{border-color:var(--yellow); background:rgba(62,125,116,0.08);}
  .pay-opt small{display:block; font-family:'IBM Plex Mono'; font-size:9.5px; color:var(--muted2); margin-top:4px; font-weight:400;}
  .err{color:var(--red); font-size:12.5px; margin-top:-8px; margin-bottom:12px; display:none;}
  .err.show{display:block;}
  .success-box{text-align:center; padding:10px 0;}
  .success-box .check{width:44px; height:44px; border:2px solid var(--yellow); color:var(--yellow); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:20px;}
  .modal-full-btn{width:100%; margin-top:4px;}

  .video-overlay{display:none; position:fixed; inset:0; background:rgba(20,16,10,0.92); z-index:100; align-items:center; justify-content:center; padding:40px 20px;}
  .video-overlay.active{display:flex;}
  .video-modal{position:relative; width:100%; max-width:900px; aspect-ratio:16/9;}
  .video-modal iframe{width:100%; height:100%; border:1px solid var(--line); border-radius:10px;}
  .video-modal.pseudo-fullscreen{
    position:fixed; inset:0; z-index:200; max-width:none; width:100vw; height:100vh; background:#000;
  }
  .video-modal.pseudo-fullscreen iframe{border:none; border-radius:0;}
  .watermark{position:absolute; pointer-events:none; z-index:5; font-family:'IBM Plex Mono'; font-weight:600; font-size:16px; color:rgba(255,255,255,0.75); background:rgba(0,0,0,0.35); padding:4px 10px; border-radius:3px; text-shadow:0 0 6px rgba(0,0,0,0.8); transition:top 1.5s ease, left 1.5s ease; white-space:nowrap;}

  .fullscreen-icon-btn{
    position:absolute; top:14px; right:14px; z-index:6;
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.2); border-radius:8px;
    color:#fff; cursor:pointer; padding:0;
  }
  .fullscreen-icon-btn:hover{background:rgba(0,0,0,0.75); border-color:rgba(255,255,255,0.4);}

  .empty{color:var(--muted); font-size:14px;}

  /* glass glare — follows the cursor via --mx/--my set in JS */
  .lecture::before, .modal::before{
    content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(260px circle at var(--mx) var(--my), var(--glare), transparent 70%);
    opacity:0; transition:opacity .8s ease; mix-blend-mode:soft-light;
  }
  .lecture:hover::before, .modal:hover::before{ opacity:1; }
  @media (prefers-reduced-motion: reduce){
    .lecture::before, .modal::before{ animation:none !important; opacity:0 !important; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="brand">
      <div class="brand-mark"><span>&#9651;</span></div>
      <div class="brand-name">SITE &amp; STRUCTURE<small data-i18n="tagline">ENGINEERING COURSE PLATFORM — PROTOTYPE</small></div>
    </a>
    <nav>
      <button class="hamburger-btn" id="hamburgerBtn" onclick="openDrawer()" aria-label="Menu" title="Menu">&#9776;</button>
      <div class="nav-links-desktop">
        <a href="index.html" data-i18n="nav_home">Home</a>
        <a href="index.html#courses" data-i18n="nav_courses">Courses</a>
        <a href="my-courses.html" id="myCoursesLink" style="display:none;" data-i18n="nav_mycourses">My courses</a>
        <button class="btn" id="loginBtn" data-i18n="log_in">Log in</button>
      </div>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      <button class="lang-toggle" id="langToggle" onclick="toggleLang()" aria-label="Toggle language" title="Toggle language"></button>
    </nav>
  </div>
</header>

<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <button class="drawer-close" onclick="closeDrawer()" aria-label="Close">&times;</button>
    <div class="drawer-title" data-i18n="menu">Menu</div>
  </div>
  <div class="drawer-links">
    <a href="index.html" data-i18n="nav_home">Home</a>
    <a href="index.html#courses" data-i18n="nav_courses">Courses</a>
    <a href="my-courses.html" id="myCoursesLinkDrawer" style="display:none;" data-i18n="nav_mycourses">My courses</a>
    <button class="btn btn-accent" id="loginBtnDrawer" data-i18n="log_in">Log in</button>
  </div>
</div>

<div class="wrap" id="content">
  <p class="empty" style="padding:60px 0;" data-i18n="loading_course">Loading course…</p>
</div>

<!-- LOGIN MODAL -->
<div class="overlay" id="loginOverlay">
  <div class="modal crop">
    <button class="modal-close" onclick="closeModal('loginOverlay')">&times;</button>
    <div id="authBody"></div>
  </div>
</div>

<!-- ENROLL MODAL -->
<div class="overlay" id="enrollOverlay">
  <div class="modal crop">
    <button class="modal-close" onclick="closeModal('enrollOverlay')">&times;</button>
    <div id="enrollBody"></div>
  </div>
</div>

<!-- VIDEO MODAL -->
<div class="video-overlay" id="videoOverlay">
  <div class="video-modal" id="videoModal">
    <button class="btn btn-close" onclick="closeVideo()" style="position:absolute; top:-44px; right:0;">Close</button>
    <iframe id="videoFrame" src="" frameborder="0" allow="autoplay"></iframe>
    <div class="watermark" id="watermark"><span id="watermarkText"></span></div>
    <button class="fullscreen-icon-btn" onclick="toggleFullscreen()" aria-label="Fullscreen" title="Fullscreen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
        <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
        <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
      </svg>
    </button>
  </div>
</div>

      err_device_limit: 'هذا الحساب مسجَّل الدخول بالفعل على جهازين (الحد الأقصى المسموح). تواصل مع الدعم لتحرير أحد الأجهزة.',
      err_fill_fields: 'املأ جميع الحقول.', err_pass_length: 'يجب ألا تقل كلمة المرور عن ٦ أحرف.',
      err_choose_payment: 'اختر طريقة دفع وأدخل بياناتك.', err_upload_proof: 'ارفع لقطة شاشة لعملية الدفع.',

    } else if(typeof renderPage === 'function' && course) renderPage();
    if(typeof updateNav === 'function') updateNav();
  }
  function toggleLang(){ applyLang(currentLang === 'ar' ? 'en' : 'ar'); }

  const SUPABASE_URL = 'https://qdarzhzttjpkgfihupgp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_eNLSJi_xpL2fnrJsHKajeQ_sT9Kds9q';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const params = new URLSearchParams(window.location.search);

  let course = null;
  let lectures = [];
  let enrollment = null;
  let selectedPay = null;
  let watermarkInterval = null;

  document.addEventListener('mousemove', (e) => {

  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('ss_theme', t); }catch(e){}

  function toggleTheme(){

  document.getElementById('loginBtn').onclick = () => { closeDrawer(); renderAuth('login'); openModal('loginOverlay'); };

  function renderAuth(mode){
    const body = document.getElementById('authBody');
    if(mode === 'login'){
      body.innerHTML = `
        <h3>${t('auth_login_title')}</h3>
        <p class="sub">${t('auth_login_sub')}</p>
        <div class="field"><label>${t('label_email')}</label><input type="email" id="authEmail" placeholder="${t('ph_email')}"></div>
        <div class="field"><label>${t('label_password')}</label><input type="password" id="authPass" placeholder="${t('ph_password')}"></div>
        <p class="err" id="authErr"></p>
        <button class="btn btn-accent modal-full-btn" onclick="submitLogin()">${t('auth_login_title')}</button>
        <p class="sub" style="margin-top:14px; text-align:center;">${t('no_account')} <a href="#" onclick="renderAuth('signup'); return false;" style="color:var(--yellow);">${t('sign_up')}</a></p>
      `;
    } else {
      body.innerHTML = `
        <h3>${t('auth_signup_title')}</h3>
        <p class="sub">${t('auth_signup_sub')}</p>
        <div class="field"><label>${t('label_fullname')}</label><input type="text" id="authName" placeholder="${t('ph_fullname')}"></div>
        <div class="field"><label>${t('label_phone')}</label><input type="text" id="authPhone" placeholder="${t('ph_phone')}"></div>
        <div class="field"><label>${t('label_email')}</label><input type="email" id="authEmail" placeholder="${t('ph_email')}"></div>
        <div class="field"><label>${t('label_password')}</label><input type="password" id="authPass" placeholder="${t('ph_password_signup')}"></div>
        <p class="err" id="authErr"></p>
        <button class="btn btn-accent modal-full-btn" onclick="submitSignup()">${t('auth_signup_title')}</button>
        <p class="sub" style="margin-top:14px; text-align:center;">${t('already_account')} <a href="#" onclick="renderAuth('login'); return false;" style="color:var(--yellow);">${t('auth_login_title')}</a></p>
      `;
    }
  }

  function showAuthErr(msg){
    const err = document.getElementById('authErr');
    err.textContent = msg; err.classList.add('show');
  }

  function makeToken(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random()*16|0;
      return (c==='x' ? r : (r&0x3|0x8)).toString(16);
    });
  }

  function getDeviceId(){
    let id = localStorage.getItem('ss_device_id');
    if(!id){ id = makeToken(); localStorage.setItem('ss_device_id', id); }
    return id;
  }

  async function checkDeviceAndClaimSession(userId, accessToken){
    const deviceId = getDeviceId();
    const res = await fetch('/api/check-device', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + accessToken },
      body: JSON.stringify({ deviceId, deviceLabel: navigator.userAgent })
    });
    if(!res.ok) return false;
    const result = await res.json();
    if(!result.allowed) return false;
    localStorage.setItem('ss_session_token', result.sessionToken);
    return true;
  }

  async function logLoginEvent(userId, email){
    let geo = {};
    try{ const r = await fetch('https://ipapi.co/json/'); geo = await r.json(); } catch(e){}
    let flagged = false, distance_km = null;
    if(geo.latitude != null && geo.longitude != null){
      const { data: prev } = await sb.from('login_events').select('lat, lon').eq('user_id', userId).not('lat', 'is', null).order('created_at', { ascending:false }).limit(1).maybeSingle();
      if(prev && prev.lat != null){
        const R=6371, dLat=(geo.latitude-prev.lat)*Math.PI/180, dLon=(geo.longitude-prev.lon)*Math.PI/180;
        const a=Math.sin(dLat/2)**2+Math.cos(prev.lat*Math.PI/180)*Math.cos(geo.latitude*Math.PI/180)*Math.sin(dLon/2)**2;
        distance_km = Math.round(R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        flagged = distance_km > 300;
      }
    }
    await sb.from('login_events').insert({ user_id:userId, email, user_agent:navigator.userAgent, ip:geo.ip||null, city:geo.city||null, country:geo.country_name||null, lat:geo.latitude??null, lon:geo.longitude??null, flagged, distance_km });
  }

  async function submitLogin(){
    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPass').value.trim();
    if(!email || !pass){ showAuthErr(t('err_enter_email_pass')); return; }
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ showAuthErr(error.message); return; }
    const allowed = await checkDeviceAndClaimSession(data.user.id, data.session.access_token);
    if(!allowed){
      await sb.auth.signOut();
      showAuthErr(t('err_device_limit'));
      return;
    }
    logLoginEvent(data.user.id, data.user.email);
    closeModal('loginOverlay');
    location.reload();
  }

  async function submitSignup(){
    const name = document.getElementById('authName').value.trim();
    const phone = document.getElementById('authPhone').value.trim();
    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPass').value.trim();
    if(!name || !phone || !email || !pass){ showAuthErr(t('err_fill_fields')); return; }
    if(pass.length < 6){ showAuthErr(t('err_pass_length')); return; }
    const { data, error } = await sb.auth.signUp({ email, password: pass, options:{ data:{ full_name:name, phone:phone } } });
    if(error){ showAuthErr(error.message); return; }
    if(data.user){
      const { error: profileErr } = await sb.from('profiles').insert({ id:data.user.id, full_name:name, phone:phone });
      if(profileErr){ showAuthErr(profileErr.message); return; }
      const allowed = await checkDeviceAndClaimSession(data.user.id, data.session.access_token);
      if(!allowed){
        await sb.auth.signOut();
        showAuthErr(t('err_device_limit'));
        return;
      }
      logLoginEvent(data.user.id, data.user.email);
    }
    closeModal('loginOverlay');
    location.reload();
  }

  function courseTitle(){ return (currentLang === 'ar' && course.title_ar) || course.title; }

  function openEnroll(){
    selectedPay = null;
    const body = document.getElementById('enrollBody');
    if(course.is_free){
      body.innerHTML = `
        <h3>${courseTitle()}</h3>
        <p class="sub">${t('free_course_sub')}</p>
        <p class="err" id="enrollErr"></p>
        <button class="btn btn-accent modal-full-btn" onclick="submitFree()">${t('enroll_free')}</button>
      `;
    } else {
      body.innerHTML = `
        <h3>${courseTitle()}</h3>
        <p class="sub">${course.price}${t('choose_payment_sub')}</p>
        <div class="pay-options">
          <div class="pay-opt" id="opt-zain" onclick="choosePay('zain')">${t('zain_cash')}<small>${t('zain_sub')}</small></div>
          <div class="pay-opt" id="opt-qi" onclick="choosePay('qi')">${t('qi_card')}<small>${t('qi_sub')}</small></div>
        </div>
        <div class="field"><label id="payLabel">${t('pay_label')}</label><input type="text" id="payDetail" placeholder="${t('pay_ph_default')}"></div>
        <div class="field"><label>${t('payment_screenshot')}</label><input type="file" id="payProof" accept="image/*"></div>
        <p class="err" id="payErr"></p>
        <button class="btn btn-accent modal-full-btn" onclick="submitPay()">${t('confirm_payment')}</button>
      `;
    }
    openModal('enrollOverlay');
  }

  function choosePay(method){
    selectedPay = method;
    document.getElementById('opt-zain').classList.toggle('selected', method==='zain');
    document.getElementById('opt-qi').classList.toggle('selected', method==='qi');
    const label = document.getElementById('payLabel'), input = document.getElementById('payDetail');
    if(method==='zain'){ label.textContent=t('zain_label'); input.placeholder=t('zain_ph'); }
    else { label.textContent=t('qi_label'); input.placeholder=t('qi_ph'); }
  }

  async function submitFree(){
    const err = document.getElementById('enrollErr');
    const { data:{ session } } = await sb.auth.getSession();
    const { error } = await sb.from('enrollments').insert({ user_id: session.user.id, course_slug: course.slug, status: 'active' });
    if(error){ err.textContent = error.message; err.classList.add('show'); return; }
    showEnrollSuccess(null);
  }

  async function submitPay(){
    const detail = document.getElementById('payDetail').value.trim();
    const proofFile = document.getElementById('payProof').files[0];
    const err = document.getElementById('payErr');
    if(!selectedPay || !detail){ err.textContent = t('err_choose_payment'); err.classList.add('show'); return; }
    if(!proofFile){ err.textContent = t('err_upload_proof'); err.classList.add('show'); return; }
    const { data:{ session } } = await sb.auth.getSession();
    const filePath = `${session.user.id}/${Date.now()}-${proofFile.name}`;
    const { error: uploadErr } = await sb.storage.from('payment-proofs').upload(filePath, proofFile);
    if(uploadErr){ err.textContent = t('err_upload_failed') + uploadErr.message; err.classList.add('show'); return; }
    const { error } = await sb.from('enrollments').insert({ user_id: session.user.id, course_slug: course.slug, status: 'pending', payment_method: selectedPay, payment_detail: detail, payment_proof_path: filePath });
    if(error){ err.textContent = error.message; err.classList.add('show'); return; }
    showEnrollSuccess(course.price + ' — ' + (selectedPay==='zain' ? t('zain_cash') : t('qi_card')));
  }

  function showEnrollSuccess(paymentInfo){
    document.getElementById('enrollBody').innerHTML = `
      <div class="success-box">
        <div class="check">&#10003;</div>
        <h3>${paymentInfo ? t('submitted') : t('enrolled')}</h3>
        <p class="sub">${courseTitle()}${paymentInfo ? ' — ' + paymentInfo : t('access_unlocked')}</p>
        ${paymentInfo ? `<p class="sub">${t('pending_note')}</p>` : ''}
        <button class="btn btn-close modal-full-btn" onclick="closeModal('enrollOverlay'); location.reload();">${t('btn_close')}</button>
      </div>`;
  }

  function moveWatermark(){
    const wm = document.getElementById('watermark');
    wm.style.top = (10 + Math.random()*70) + '%';
    wm.style.left = (10 + Math.random()*60) + '%';
  }

  function toggleFullscreen(){
    document.getElementById('videoModal').classList.toggle('pseudo-fullscreen');
  }

  async function fetchVideoUrl(lectureId, accessToken){
    const deviceId = getDeviceId();
    const sessionToken = localStorage.getItem('ss_session_token');
    const res = await fetch('/api/get-video-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + accessToken },
      body: JSON.stringify({ lectureId, deviceId, sessionToken })
    });
    return { res, result: await res.json() };
  }

  async function watchLecture(lectureId){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ renderAuth('login'); openModal('loginOverlay'); return; }
    let { res, result } = await fetchVideoUrl(lectureId, session.access_token);
    if(res.status === 401){
      const refreshed = await sb.auth.refreshSession();
      if(refreshed.data.session){
        ({ res, result } = await fetchVideoUrl(lectureId, refreshed.data.session.access_token));
      }
    }
    if(!res.ok){ alert(result.error || t('err_video_unavailable')); return; }

    const { data:{ session: freshSession } } = await sb.auth.getSession();
    const { data: prof } = await sb.from('profiles').select('phone').eq('id', freshSession.user.id).maybeSingle();
    document.getElementById('watermarkText').textContent = (prof && prof.phone) ? prof.phone : freshSession.user.email;
    moveWatermark();
    watermarkInterval = setInterval(moveWatermark, 4000);

    document.getElementById('videoFrame').src = result.url;
    document.getElementById('videoOverlay').classList.add('active');
  }

  function closeVideo(){
    document.getElementById('videoOverlay').classList.remove('active');
    document.getElementById('videoModal').classList.remove('pseudo-fullscreen');
    document.getElementById('videoFrame').src = '';
    clearInterval(watermarkInterval);
  }

  document.querySelectorAll('.overlay').forEach(ov => {
    ov.addEventListener('click', e => { if(e.target === ov) ov.classList.remove('active'); });
  });

  function renderPage(){
    const el = document.getElementById('content');
    if(!course){
      el.innerHTML = `<p class="empty" style="padding:60px 0;">${t('course_not_found')}</p>`;
      return;
    }
    const isActive = enrollment && enrollment.status === 'active';
    const isPending = enrollment && enrollment.status === 'pending';
    const isAr = currentLang === 'ar';

    const title = (isAr && course.title_ar) || course.title;
    const description = (isAr && course.description_ar) || course.description;
    const teacherName = (isAr && course.teacher_name_ar) || course.teacher_name;
    const tagLabel = (isAr && course.tag_label_ar) || course.tag_label;
    const meta = (isAr && course.meta_ar) || course.meta;
    const metaHtml = Object.entries(meta || {}).map(([k,v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('');

    let priceHtml;
    if(isActive){
      priceHtml = `<span class="status-badge active">${t('status_active')}</span>`;
    } else if(isPending){
      priceHtml = `<span class="status-badge pending">${t('status_pending')}</span>`;
    } else if(course.is_free){
      priceHtml = `<span class="price free">${t('card_free')}</span><button class="btn btn-accent" onclick="openEnroll()">${t('enroll_free')}</button>`;
    } else {
      priceHtml = `<span class="price">${course.price}</span><button class="btn btn-accent" onclick="openEnroll()">${t('enroll')}</button>`;
    }

    const lectureRows = lectures.length === 0
      ? `<p class="empty">${t('no_lectures')}</p>`
      : lectures.map(l => {
          const unlocked = l.is_free || isActive;
          const lTitle = (isAr && l.title_ar) || l.title;
          return `
            <div class="lecture">
              <div class="lecture-title">${lTitle}${l.is_free ? `<span class="lecture-free">${t('free_tag')}</span>` : ''}</div>
              ${unlocked
                ? `<button class="btn" onclick="watchLecture('${l.id}')">${t('watch')}</button>`
                : `<span class="lecture-lock">${t('locked')}</span>`}
            </div>`;
        }).join('');

    el.innerHTML = `
      <div class="course-head">
        <div class="tag ${course.tag_color === 'green' ? 'green' : ''}">${tagLabel || ''}</div>
        <h1>${title}</h1>
        ${teacherName ? `<div class="byline">${t('by')} ${teacherName}</div>` : ''}
        <p class="desc">${description || ''}</p>
        <div class="meta-grid">${metaHtml}</div>
        <div class="price-box">${priceHtml}</div>
      </div>
      <div class="section">
        <h2>${t('curriculum')}</h2>
        ${lectureRows}
      </div>
    `;
  }

  async function updateNav(){
    const { data:{ session } } = await sb.auth.getSession();
    const loginBtn = document.getElementById('loginBtn');
    const loginBtnDrawer = document.getElementById('loginBtnDrawer');
    if(session){
      document.getElementById('myCoursesLink').style.display = '';
      document.getElementById('myCoursesLinkDrawer').style.display = '';
      [loginBtn, loginBtnDrawer].forEach(btn => { btn.textContent = t('log_out'); btn.onclick = async () => { await sb.auth.signOut(); location.reload(); }; });
    } else {
      const openLogin = () => { closeDrawer(); renderAuth('login'); openModal('loginOverlay'); };
      [loginBtn, loginBtnDrawer].forEach(btn => { btn.textContent = t('log_in'); btn.onclick = openLogin; });
    }
  }

  (async () => {
    if(!slug){
      document.getElementById('content').innerHTML = `<p class="empty" style="padding:60px 0;">${t('no_course_specified')}</p>`;
      return;
    }
    await updateNav();

    const { data: courseData } = await sb.from('courses').select('*').eq('slug', slug).eq('status', 'published').maybeSingle();
    course = courseData;

    if(course){
      const { data: lectureData } = await sb.from('lectures').select('*').eq('course_id', course.id).order('order_index');
      lectures = lectureData || [];

      const { data:{ session } } = await sb.auth.getSession();
      if(session){
        const { data: enr } = await sb.from('enrollments').select('status').eq('user_id', session.user.id).eq('course_slug', course.slug).maybeSingle();
        enrollment = enr;
      }
    }
    renderPage();
  })();
