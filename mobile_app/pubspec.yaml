name: site_and_structure
description: Arc Platform — engineering course platform (student app)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  video_player: ^2.9.1
  webview_flutter: ^4.8.0
  http: ^1.2.1
  image_picker: ^1.1.2
  provider: ^6.1.2
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  device_info_plus: ^11.1.1
  android_id: ^0.4.0
  audioplayers: ^6.1.0
  gal: ^2.3.0
  connectivity_plus: 6.1.0
  file_picker: ^10.2.4
  pdfx: ^2.11.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: 19.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Logo fonts (Montserrat, Alexandria; SIL OFL, licenses alongside) shipped
  # with the app so the launch intro never waits on a download. google_fonts
  # finds them here by file name before trying the network.
  assets:
    - assets/google_fonts/
    - assets/sounds/
  # Arabic UI text. Every Latin style keeps its own family and lists this as
  # its fallback, so Arabic glyphs render in the brand face (with real
  # weights) instead of the phone's system font.
  fonts:
    - family: ArcArabic
      fonts:
        - asset: assets/google_fonts/Alexandria-Light.ttf
          weight: 300
        - asset: assets/google_fonts/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Alexandria-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Alexandria-ExtraBold.ttf
          weight: 800
