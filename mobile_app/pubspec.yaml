name: site_and_structure
description: Arc Platform — engineering course platform (student app)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  video_player: ^2.9.1
  webview_flutter: ^4.8.0
  http: ^1.2.1
  image_picker: ^1.1.2
  provider: ^6.1.2
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  device_info_plus: ^11.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Logo fonts (Montserrat, Alexandria; SIL OFL, licenses alongside) shipped
  # with the app so the launch intro never waits on a download. google_fonts
  # finds them here by file name before trying the network.
  assets:
    - assets/google_fonts/
