<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Site & Structure</title>
<script>(function(){try{var t=localStorage.getItem('ss_theme')||'dark'; document.documentElement.setAttribute('data-theme', t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#14120F;
    --panel:#1D1A16;
    --line:rgba(243,237,228,0.12);
    --red:#E8622C;
    --yellow:#6FA8A0;
    --text:#F3EDE4;
    --muted:#AFA492;
    --muted2:#7D7362;
    --glass-bg:rgba(38,34,28,0.5);
    --glass-border:rgba(243,237,228,0.16);
    --glare:rgba(255,255,255,0.14);
  }
  :root[data-theme="light"]{
    --bg:#F3EFE7;
    --panel:#FFFFFF;
    --line:rgba(30,25,18,0.14);
    --red:#C94E1F;
    --yellow:#3E7D74;
    --text:#1E1912;
    --muted:#5C5344;
    --muted2:#8C8171;
    --glass-bg:rgba(255,255,255,0.55);
    --glass-border:rgba(255,255,255,0.7);
    --glare:rgba(255,255,255,0.8);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    line-height:1.6;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .modal{
    --mx:50%; --my:50%;
    background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:20px; width:100%; max-width:420px; padding:28px;
    position:relative; overflow:hidden; isolation:isolate;
    box-shadow:0 24px 60px -20px rgba(30,25,18,0.2);
    backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
    transition:transform .4s cubic-bezier(0.16,1,0.3,1), box-shadow .4s cubic-bezier(0.16,1,0.3,1);
  }
  .modal:hover{transform:translateY(-4px); box-shadow:0 32px 68px -16px rgba(30,25,18,0.3), 0 0 44px -6px color-mix(in srgb, var(--red) 45%, transparent);}
  .modal h3{font-family:'Big Shoulders Display'; font-weight:800; font-size:22px; margin-bottom:6px; text-transform:uppercase;}
  .modal .sub{color:var(--muted); font-size:13px; margin-bottom:22px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--muted2); letter-spacing:0.5px; text-transform:uppercase; margin-bottom:6px;}
  .field input{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:10px 12px; font-size:14px; font-family:'Work Sans';
  }
  .field input:focus{outline:none; border-color:var(--red);}
  .btn{
    font-family:'Work Sans'; font-size:13px; font-weight:600;
    padding:10px 18px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer; width:100%;
  }
  .btn-accent{background:var(--red); border-color:var(--red); color:#fff;}
  .btn-accent:hover{transform:translateY(-1px); box-shadow:0 10px 24px -8px rgba(201,78,31,0.5);}
  .err{color:var(--red); font-size:12.5px; margin-top:-8px; margin-bottom:12px; display:none;}
  .err.show{display:block;}
  .success-box{text-align:center;}
  .check{width:44px; height:44px; border:2px solid var(--yellow); color:var(--yellow); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:20px;}

  /* glass glare — follows the cursor via --mx/--my set in JS */
  .modal::before{
    content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(480px circle at var(--mx) var(--my), var(--glare), transparent 60%);
    opacity:0; transition:opacity .8s ease;
  }
  .modal:hover::before{ opacity:1; }
  @media (prefers-reduced-motion: reduce){
    .modal::before{ animation:none !important; opacity:0 !important; }
  }
</style>
</head>
<body>

<div class="modal" id="box">
  <h3>Set a new password</h3>
  <p class="sub">Choose a new password for your account.</p>
  <div class="field"><label>New password</label><input type="password" id="newPass" placeholder="At least 6 characters"></div>
  <p class="err" id="err"></p>
  <button class="btn btn-accent" onclick="submitNewPassword()">Update password</button>
</div>

<script>
  document.addEventListener('mousemove', (e) => {
    const el = e.target.closest('.modal');
    if(!el) return;
    const rect = el.getBoundingClientRect();
    el.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width * 100) + '%');
    el.style.setProperty('--my', ((e.clientY - rect.top) / rect.height * 100) + '%');
  });

  const SUPABASE_URL = 'https://qdarzhzttjpkgfihupgp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_eNLSJi_xpL2fnrJsHKajeQ_sT9Kds9q';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function submitNewPassword(){
    const pass = document.getElementById('newPass').value.trim();
    const err = document.getElementById('err');
    if(pass.length < 6){ err.textContent = 'Password must be at least 6 characters.'; err.classList.add('show'); return; }
    const { error } = await sb.auth.updateUser({ password: pass });
    if(error){ err.textContent = error.message; err.classList.add('show'); return; }
    document.getElementById('box').innerHTML = `
      <div class="success-box">
        <div class="check">&#10003;</div>
        <h3>Password updated</h3>
        <p class="sub">You can now log in with your new password.</p>
        <button class="btn btn-accent" onclick="window.location.href='index.html'">Go to site</button>
      </div>`;
  }
</script>

</body>
</html>
