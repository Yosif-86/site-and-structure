name = "site-structure-videos"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[r2_buckets]]
binding = "VIDEOS_BUCKET"
bucket_name = "site-structure-videos"

# Daily storage cleanup (see cleanupStorage in src/index.js), 03:30 Baghdad.
# CLEANUP_MODE "dry" only logs what it would delete; "live" deletes.
# Needs: wrangler secret put SUPABASE_SERVICE_ROLE_KEY
[triggers]
crons = ["30 0 * * *"]

[vars]
CLEANUP_MODE = "live"

# Set the shared signing secret (must match R2_SECURITY_KEY
# used in api/get-video-url.js) with:
#   wrangler secret put SECURITY_KEY
