<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Courses — Site & Structure</title>
<script>(function(){try{var t=localStorage.getItem('ss_theme')||'dark'; document.documentElement.setAttribute('data-theme', t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#14120F;
    --panel:#1D1A16;
    --panel2:#26221C;
    --grid:#14120F;
    --line:rgba(243,237,228,0.12);
    --red:#E8622C;
    --yellow:#6FA8A0;
    --green:#6FA8A0;
    --text:#F3EDE4;
    --muted:#AFA492;
    --muted2:#7D7362;
    --glass-bg:rgba(38,34,28,0.5);
    --glass-border:rgba(243,237,228,0.16);
    --glare:rgba(255,255,255,0.14);
  }
  :root[data-theme="light"]{
    --bg:#F3EFE7;
    --panel:#FFFFFF;
    --panel2:#EAE3D6;
    --grid:#F3EFE7;
    --line:rgba(30,25,18,0.14);
    --red:#C94E1F;
    --yellow:#3E7D74;
    --green:#3E7D74;
    --text:#1E1912;
    --muted:#5C5344;
    --muted2:#8C8171;
    --glass-bg:rgba(255,255,255,0.55);
    --glass-border:rgba(255,255,255,0.7);
    --glare:rgba(255,255,255,0.8);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{overflow-x:hidden; max-width:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    line-height:1.6;
    transition:background .2s ease, color .2s ease;
  }
  .wrap{max-width:1040px; margin:0 auto; padding:0 24px;}
  .crop{position:relative;}

  header{border-bottom:1px solid var(--line); padding:20px 0; position:sticky; top:0; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); z-index:50;}
  header .wrap{display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;}
  .brand-mark{width:34px; height:34px; border-radius:8px; background:linear-gradient(145deg, var(--red), color-mix(in srgb, var(--red) 55%, black)); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-size:11px; color:#fff;}
  .brand-mark span{}
  .brand-name{font-family:'Big Shoulders Display'; font-weight:800; font-size:19px; letter-spacing:0.2px; text-transform:uppercase;}
  .brand-name small{display:block; font-family:'IBM Plex Mono'; font-size:10px; color:var(--muted2); font-weight:400; letter-spacing:1px; text-transform:none;}
  nav{display:flex; gap:28px; align-items:center; flex-wrap:wrap;}
  nav a{color:var(--muted); text-decoration:none; font-size:14px;}
  nav a:hover{color:var(--text);}
  .theme-toggle{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; padding:0; line-height:1;
  }
  .theme-toggle:hover{background:var(--panel2);}

  @media (max-width:700px){
    header .wrap{flex-wrap:wrap; row-gap:12px;}
    nav{gap:12px 16px; width:100%;}
    .brand-name{font-size:15px;}
    .brand-name small{font-size:8px;}
  }
  .btn{
    font-family:'Work Sans'; font-size:13px; font-weight:600;
    padding:10px 20px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover{background:var(--panel2);}

  .section{padding:64px 0;}
  .section-head{margin-bottom:36px;}
  h2{font-family:'Big Shoulders Display'; font-weight:800; font-size:28px; text-transform:uppercase;}
  .section-tag{font-family:'IBM Plex Mono'; font-size:11px; color:var(--muted2); letter-spacing:1px; text-transform:uppercase;}

  .list{display:flex; flex-direction:column; gap:14px;}
  .row{
    --mx:50%; --my:50%;
    background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:14px; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px;
    position:relative; overflow:hidden; isolation:isolate;
    backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 16px 40px -24px rgba(30,25,18,0.25);
    transition:transform .4s cubic-bezier(0.16,1,0.3,1), box-shadow .4s cubic-bezier(0.16,1,0.3,1);
  }
  .row:hover{transform:translateY(-4px); box-shadow:0 26px 50px -20px rgba(30,25,18,0.35), 0 0 40px -8px color-mix(in srgb, var(--red) 50%, transparent);}
  .row h3{font-family:'Work Sans'; font-size:16px; font-weight:600; text-transform:none;}
  .row .meta{font-family:'IBM Plex Mono'; font-size:11px; color:var(--muted2); margin-top:4px;}
  .status{font-family:'IBM Plex Mono'; font-size:10.5px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); letter-spacing:0.5px; text-transform:uppercase; white-space:nowrap;}
  .status.active{color:var(--green); border-color:var(--green);}
  .status.pending{color:var(--yellow); border-color:var(--yellow);}
  .empty{color:var(--muted); font-size:14px;}

  .overlay{
    display:none; position:fixed; inset:0; background:rgba(20,16,10,0.92); z-index:100; align-items:center; justify-content:center; padding:40px 20px;
  }
  .overlay.active{display:flex;}
  .video-modal{position:relative; width:100%; max-width:900px; aspect-ratio:16/9;}
  .video-modal iframe{width:100%; height:100%; border:1px solid var(--line); border-radius:10px;}
  .video-modal:fullscreen, .video-modal:-webkit-full-screen{max-width:none; width:100vw; height:100vh; background:#000;}
  .video-modal:fullscreen iframe, .video-modal:-webkit-full-screen iframe{border:none; border-radius:0;}

  .watermark{
    position:absolute; pointer-events:none; z-index:5;
    font-family:'IBM Plex Mono'; font-weight:600; font-size:16px; color:rgba(255,255,255,0.75);
    background:rgba(0,0,0,0.35); padding:4px 10px; border-radius:3px;
    text-shadow:0 0 6px rgba(0,0,0,0.8); transition:top 1.5s ease, left 1.5s ease;
    white-space:nowrap;
  }

  /* glass glare — follows the cursor via --mx/--my set in JS */
  .row::before{
    content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(480px circle at var(--mx) var(--my), var(--glare), transparent 60%);
    opacity:0; transition:opacity .8s ease;
  }
  .row:hover::before{ opacity:1; }
  @keyframes glareSweep{
    0%{ transform:translateX(-60%) rotate(8deg); }
    60%,100%{ transform:translateX(60%) rotate(8deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .row::before{ animation:none !important; opacity:0 !important; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="brand">
      <div class="brand-mark"><span>&#9651;</span></div>
      <div class="brand-name">SITE &amp; STRUCTURE<small>ENGINEERING COURSE PLATFORM — PROTOTYPE</small></div>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#courses">Courses</a>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      <button class="btn" id="logoutBtn">Log out</button>
    </nav>
  </div>
</header>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div class="section-tag">Your account</div>
      <h2>My courses</h2>
    </div>
    <div class="list" id="list"></div>
  </div>
</section>

<script>
  const SUPABASE_URL = 'https://qdarzhzttjpkgfihupgp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_eNLSJi_xpL2fnrJsHKajeQ_sT9Kds9q';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  document.addEventListener('mousemove', (e) => {
    const el = e.target.closest('.row');
    if(!el) return;
    const rect = el.getBoundingClientRect();
    el.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width * 100) + '%');
    el.style.setProperty('--my', ((e.clientY - rect.top) / rect.height * 100) + '%');
  });

  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('ss_theme', t); }catch(e){}
    const btn = document.getElementById('themeToggle');
    if(btn) btn.textContent = t === 'dark' ? '☀' : '☾';
  }
  function toggleTheme(){
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }
  applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

  document.getElementById('logoutBtn').onclick = async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  };

  (async () => {
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){
      window.location.href = 'index.html';
      return;
    }

    const { data: enrollments } = await sb.from('enrollments')
      .select('course_slug, status, created_at')
      .eq('user_id', session.user.id)
      .order('created_at', { ascending: false });

    const list = document.getElementById('list');
    if(!enrollments || enrollments.length === 0){
      list.innerHTML = '<p class="empty">You haven\'t enrolled in any courses yet. <a href="index.html#courses" style="color:var(--yellow);">Browse the catalogue</a>.</p>';
      return;
    }

    const { data: courses } = await sb.from('courses').select('slug, title').in('slug', enrollments.map(e => e.course_slug));
    const titleBySlug = {};
    (courses || []).forEach(c => { titleBySlug[c.slug] = c.title; });

    list.innerHTML = enrollments.map(e => {
      const title = titleBySlug[e.course_slug] || e.course_slug;
      const isActive = e.status === 'active';
      const date = new Date(e.created_at).toLocaleDateString();
      return `
        <div class="row crop">
          <div>
            <h3>${title}</h3>
            <div class="meta">Enrolled ${date}</div>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <a class="btn" href="course.html?slug=${e.course_slug}" style="text-decoration:none;">${isActive ? 'Watch' : 'View'}</a>
            <div class="status ${isActive ? 'active' : 'pending'}">${isActive ? 'Active' : 'Awaiting approval'}</div>
          </div>
        </div>`;
    }).join('');
  })();
</script>

</body>
</html>
